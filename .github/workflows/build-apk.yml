name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build APK (universal + arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Build debug APK (universal, all ABIs) for easy sideload testing.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Build perf/release APKs split by ABI (arm64-v8a + armeabi-v7a) plus universal.
      - name: Build perf APKs (ABI splits)
        run: ./gradlew :app:assemblePerf --stacktrace

      # Fail loudly before uploading: a missing, truncated or corrupt APK must not
      # turn into a green run with an unusable (or absent) artifact.
      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t debug < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk')
          mapfile -t perf < <(find app/build/outputs/apk/perf -maxdepth 1 -type f -name '*.apk' | sort)
          echo "debug APKs: ${#debug[@]}"
          echo "perf APKs: ${#perf[@]}"
          test "${#debug[@]}" -eq 1
          test "$(basename "${debug[0]}")" = "app-debug.apk"
          test "${#perf[@]}" -eq 3
          for apk in "${debug[@]}" "${perf[@]}"; do
            case "$(basename "$apk")" in
              app-debug.apk|app-universal-perf.apk|app-arm64-v8a-perf.apk|app-armeabi-v7a-perf.apk) ;;
              *) echo "unexpected APK name: $apk"; exit 1 ;;
            esac
            test -s "$apk"
            test "$(stat -c%s "$apk")" -gt 10485760
            unzip -t "$apk" > /dev/null
            ls -lh "$apk"
            sha256sum "$apk"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mika-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload perf APKs
        uses: actions/upload-artifact@v7
        with:
          name: mika-perf-apks
          path: app/build/outputs/apk/perf/*.apk
          retention-days: 30
          if-no-files-found: error
